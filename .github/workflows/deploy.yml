name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Activar el beacon cookieless del ecosistema en el build (M6): estas
      # PUBLIC_* se leen en build-time (import.meta.env) y hacen que Base.astro
      # emita el sendBeacon a /admin de nexotools. Respeta Do Not Track y no
      # manda cookies/IP/UA. El endpoint de ingesta del hub ya está live.
      - name: Build (beacon del ecosistema activado)
        run: npm run build
        env:
          PUBLIC_NEXO_BEACON_ENABLED: 'true'
          PUBLIC_NEXO_HUB_URL: 'https://nexotools.alvarocdev.com'

      # Credenciales: cuenta FTP dedicada "deploy" creada en hPanel →
      # alvarocdev.com → Cuentas FTP, con directorio fijado al public_html
      # del dominio: entra parada en el docroot, por eso server-dir es "./".
      # No usar clean-slate: en public_html convive el symlink nexolinks.
      - name: Subir dist/ por FTP
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ./

      - name: Reintento FTP (timeout transitorio)
        if: steps.ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ./
