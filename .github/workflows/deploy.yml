name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un push detrás de otro no puede solapar dos subidas FTP sobre el mismo docroot.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `astro check` es el único check mecánico que este sitio puede tener sin
      # una suite: translations.ts está tipado como Record<Locale, Translation>,
      # así que un idioma al que le falte una clave rompe acá y no en producción.
      - name: astro check (tipos + i18n completo)
        run: npx astro check

      # Informativo, no bloqueante. Los avisos abiertos hoy son de Astro (XSS en
      # rutas SSR: server islands, view transitions, spread props) y de sharp,
      # que acá es dependencia de BUILD. Este sitio se prerenderiza a HTML
      # estático y no despliega servidor, así que ninguno de esos caminos existe
      # en producción. El fix real es subir a Astro 7 (dos majors) y está en el
      # BACKLOG con su disparador: no se hace en un deploy automático.
      - name: Auditoría de dependencias (informativa)
        continue-on-error: true
        run: npm audit --audit-level=high

  deploy:
    name: Build & deploy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Activar el beacon cookieless del ecosistema en el build (M6): estas
      # PUBLIC_* se leen en build-time (import.meta.env) y hacen que Base.astro
      # emita el sendBeacon a /admin de nexotools. Respeta Do Not Track y no
      # manda cookies/IP/UA. El endpoint de ingesta del hub ya está live.
      - name: Build (beacon del ecosistema activado)
        run: npm run build
        env:
          PUBLIC_NEXO_BEACON_ENABLED: 'true'
          PUBLIC_NEXO_HUB_URL: 'https://nexotools.alvarocdev.com'

      # Credenciales: cuenta FTP dedicada "deploy" creada en hPanel →
      # alvarocdev.com → Cuentas FTP, con directorio fijado al public_html
      # del dominio: entra parada en el docroot, por eso server-dir es "./".
      # No usar clean-slate: en public_html convive el symlink nexolinks.
      - name: Subir dist/ por FTP
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ./

      - name: Reintento FTP (timeout transitorio)
        if: steps.ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ./
