name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Paso temporal: muestra la raíz del FTP para confirmar a qué cuenta
      # entra. La correcta muestra: nexo, public_html, DO_NOT_UPLOAD_HERE.
      - name: Verificar cuenta FTP (debug)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -ksS --ssl-reqd --list-only "ftp://$FTP_SERVER/" --user "$FTP_USERNAME:$FTP_PASSWORD" || echo "(exit: $?)"

      # Credenciales: las de hPanel → Sitios web → alvarocdev.com →
      # Archivos → Cuentas FTP (usuario u827592577). Esa cuenta entra en la
      # raíz del dominio, donde vive public_html/. No usar clean-slate:
      # en public_html conviven el symlink nexolinks y otros despliegues.
      - name: Subir dist/ por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: public_html/
