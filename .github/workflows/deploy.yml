name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Paso temporal de diagnóstico: lista la estructura del FTP para
      # confirmar dónde vive public_html. Borrar cuando el deploy funcione.
      - name: Listar estructura FTP (debug)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          list() {
            echo "== $1"
            curl -ksS --ssl-reqd --list-only "ftp://$FTP_SERVER/$1" --user "$FTP_USERNAME:$FTP_PASSWORD" || echo "   (exit: $?)"
          }
          list ""
          list "domains/"
          list "domains/alvarocdev.com/"
          list "public_html/"

      # Si la conexión falla con "ftps", cambiar protocol a "ftp".
      # La cuenta FTP de Hostinger entra en el home de la cuenta, no en el
      # del dominio: la web vive en domains/<dominio>/public_html/.
      - name: Subir dist/ por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: domains/alvarocdev.com/public_html/
