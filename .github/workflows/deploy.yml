name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Paso temporal de diagnóstico: lista la estructura del FTP para
      # confirmar dónde vive public_html. Borrar cuando el deploy funcione.
      - name: Listar estructura FTP (debug)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "== raíz:"
          curl -s --ssl-reqd "ftp://$FTP_SERVER/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          echo "== domains/:"
          curl -s --ssl-reqd "ftp://$FTP_SERVER/domains/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          echo "== domains/alvarocdev.com/:"
          curl -s --ssl-reqd "ftp://$FTP_SERVER/domains/alvarocdev.com/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          echo "== public_html/ (si existe en la raíz):"
          curl -s --ssl-reqd "ftp://$FTP_SERVER/public_html/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true

      # Si la conexión falla con "ftps", cambiar protocol a "ftp".
      # La cuenta FTP de Hostinger entra en el home de la cuenta, no en el
      # del dominio: la web vive en domains/<dominio>/public_html/.
      - name: Subir dist/ por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: domains/alvarocdev.com/public_html/
